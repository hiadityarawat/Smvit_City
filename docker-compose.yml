name: socialverse

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socialverse}
      POSTGRES_USER: ${POSTGRES_USER:-socialverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialverse_dev}
    ports:
      - "5432:5432"
    volumes:
      - socialverse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-socialverse}:${POSTGRES_PASSWORD:-socialverse_dev}@postgres:5432/${POSTGRES_DB:-socialverse}?schema=public
      SERVER_PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-development-access-secret-change-me}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-development-refresh-secret-change-me}
      COOKIE_SECURE: "false"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
        VITE_SOCKET_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  socialverse_postgres:
